name: Hourly Appwrite Sync

on:
  schedule:
    # Dual schedule: GitHub cron is best-effort; two slots raise hit rate.
    - cron: "33 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - external-hourly-sync

concurrency:
  group: appwrite-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export Appwrite data
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT || vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID || vars.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID || vars.APPWRITE_DATABASE_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY || vars.APPWRITE_API_KEY }}
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT || vars.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID || vars.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          NEXT_PUBLIC_APPWRITE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_DATABASE_ID || vars.NEXT_PUBLIC_APPWRITE_DATABASE_ID }}
          NEXT_PUBLIC_APPWRITE_API_KEY: ${{ secrets.NEXT_PUBLIC_APPWRITE_API_KEY || vars.NEXT_PUBLIC_APPWRITE_API_KEY }}
          # Keep ~7 days if the job fires twice/hour (2 × 24 × 7 = 336).
          APPWRITE_HISTORY_KEEP_COUNT: "336"
          APPWRITE_EXPORT_DEBUG: "1"
          APPWRITE_HTTP_RETRIES: "2"
        run: python scripts/fetch_appwrite_backup.py

      - name: Commit updated backup files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain -- data/appwrite)" ]; then
            echo "No backup changes detected."
            exit 0
          fi

          git add data/appwrite
          git commit -m "chore: update appwrite backup"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
